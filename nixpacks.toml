# Coolify Laravel (Nixpacks) — nginx + php-fpm + queue worker
# Docs: https://coolify.io/docs/applications/laravel
#
# In Coolify:
#   Build Pack     = Nixpacks  (preferred over Railpack for Laravel)
#   Ports Exposes  = 80
#   Base Directory = /
#   Clear Install / Build / Start overrides (nixpacks.toml owns them)

[phases.setup]
nixPkgs = ["...", "python311Packages.supervisor"]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-*.conf /etc/supervisor/conf.d/",
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = '/assets/start.sh'

[variables]
NIXPACKS_PHP_ROOT_DIR = "/app/public"
IS_LARAVEL = "true"

[staticAssets]
"start.sh" = '''
#!/bin/bash
set -e

mkdir -p /app/storage/framework/{cache,sessions,views} /app/storage/logs /app/bootstrap/cache
mkdir -p /app/storage/app/public /app/storage/app/private

# Optional first-boot migrate (set RUN_MIGRATIONS=true in Coolify env)
# Prefer Coolify Post-deployment: `php artisan migrate --force`
# Seed only once manually: `php artisan db:seed --force` (do not put --seed in post-deploy)
# Full Coolify CI/CD steps: docs/COOLIFY.md
if [ "${RUN_MIGRATIONS:-false}" = "true" ]; then
  php /app/artisan migrate --force --no-interaction || true
fi

# Sync committed seed images (database/seeders/assets) into the persistent
# public disk volume. Idempotent: copies missing/changed files, never deletes.
php /app/artisan db:seed --class='Database\Seeders\SeedAssetsSeeder' --force --no-interaction || true

chown -R www-data:www-data /app/storage /app/bootstrap/cache
chmod -R 775 /app/storage /app/bootstrap/cache

php /app/artisan storage:link --force --no-interaction || true
php /app/artisan config:cache --no-interaction || true
# /storage is served by nginx try_files and never hits Laravel CORS.
# Render config/cors.php into the map nginx includes below.
php /app/artisan storage:cors-map --path=/etc/nginx-storage-cors.conf --no-interaction
php /app/artisan route:cache --no-interaction || true
php /app/artisan view:cache --no-interaction || true

node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''
[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''
[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''
[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''
[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600'
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
php_admin_value[post_max_size] = 35M
php_admin_value[upload_max_filesize] = 30M
php_admin_value[memory_limit] = 512M
'''

"nginx.template.conf" = '''
user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;
}

http {
    include    $!{nginx}/conf/mime.types;
    include /etc/nginx-storage-cors.conf;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app/public;
        )

        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 35M;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Panoramas (uploads/rooms) are fetched cross-origin by WebGL.
        # Reflect the allowlist from config/cors.php — no wildcard.
        # private: a shared cache must not pin one origin's ACAO onto another.
        location ^~ /storage/uploads/rooms/ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Vary "Origin" always;
            add_header Cache-Control "private, max-age=14400" always;
            add_header Access-Control-Allow-Origin $storage_cors_origin always;
            add_header Access-Control-Allow-Credentials $storage_cors_credentials always;

            if ($request_method = OPTIONS) {
                add_header X-Content-Type-Options "nosniff" always;
                add_header Vary "Origin" always;
                add_header Cache-Control "private, max-age=14400" always;
                add_header Access-Control-Allow-Origin $storage_cors_origin always;
                add_header Access-Control-Allow-Credentials $storage_cors_credentials always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "$http_access_control_request_headers" always;
                add_header Content-Length 0;
                return 204;
            }

            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
